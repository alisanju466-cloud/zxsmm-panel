<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>SMM Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>SMM Panel</h1>
      <p id="welcome">Welcome</p>
    </div>
    <div class="tg-badge">TG</div>
  </header>

  <main>
    <section class="balance-card">
      <span>Available Balance</span>
      <h2 id="balance">₹0.00</h2>
    </section>

    <section class="quick-grid">
      <button onclick="openSection('services')">🛒<b>New Order</b><small>Browse services</small></button>
      <button onclick="openSection('orders')">📦<b>My Orders</b><small>Track your orders</small></button>
      <button onclick="openSection('wallet')">💰<b>Add Funds</b><small>Top up balance</small></button>
      <button onclick="openSection('profile')">👤<b>Profile</b><small>Account details</small></button>
    </section>

    <section id="content" class="card">
      <h3>Services</h3>
      <div id="services-list">
        <p class="muted">Loading services...</p>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
