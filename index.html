<!doctype html>
<html lang="en">
<head>
 <style>
/* =========================
   NEON PARTICLE BACKGROUND
========================= */

#particle-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    background: #050805;
}

body {
    background: #050805 !important;
    position: relative;
}

/* Keep website content above particles */
body > *:not(#particle-bg) {
    position: relative;
    z-index: 1;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const canvas = document.createElement("canvas");
    canvas.id = "particle-bg";
    document.body.prepend(canvas);

    const ctx = canvas.getContext("2d");

    let particles = [];
    let mouse = {
        x: null,
        y: null,
        radius: 120
    };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createParticles();
    }

    function createParticles() {
        particles = [];

        const count = Math.min(
            90,
            Math.max(35, Math.floor(window.innerWidth / 15))
        );

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2 + 0.5,
                speedX: (Math.random() - 0.5) * 0.35,
                speedY: (Math.random() - 0.5) * 0.35,
                opacity: Math.random() * 0.6 + 0.2
            });
        }
    }

    function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {

            const p = particles[i];

            p.x += p.speedX;
            p.y += p.speedY;

            if (p.x < 0 || p.x > canvas.width) {
                p.speedX *= -1;
            }

            if (p.y < 0 || p.y > canvas.height) {
                p.speedY *= -1;
            }

            /* Mouse interaction */
            if (mouse.x !== null && mouse.y !== null) {
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;

                    p.x -= dx * force * 0.012;
                    p.y -= dy * force * 0.012;
                }
            }

            /* Glow */
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

            ctx.fillStyle =
                "rgba(0, 255, 100, " + p.opacity + ")";

            ctx.shadowBlur = 12;
            ctx.shadowColor = "rgba(0, 255, 100, 0.8)";

            ctx.fill();

            ctx.shadowBlur = 0;
        }

        /* Connecting lines */
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {

                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;

                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 120) {

                    const opacity =
                        (1 - distance / 120) * 0.15;

                    ctx.beginPath();
                    ctx.moveTo(
                        particles[i].x,
                        particles[i].y
                    );

                    ctx.lineTo(
                        particles[j].x,
                        particles[j].y
                    );

                    ctx.strokeStyle =
                        "rgba(0, 255, 100, " + opacity + ")";

                    ctx.lineWidth = 0.6;
                    ctx.stroke();
                }
            }
        }

        requestAnimationFrame(drawParticles);
    }

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("mousemove", function (event) {
        mouse.x = event.clientX;
        mouse.y = event.clientY;
    });

    window.addEventListener("mouseleave", function () {
        mouse.x = null;
        mouse.y = null;
    });

    resizeCanvas();
    drawParticles();
});
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020402">
<title>ZXSMM Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020402;--card:#07100a;--green:#39ff88;--muted:#8fa596;--border:rgba(57,255,136,.35)}
html,body{min-height:100%;background:#020402}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:
radial-gradient(circle at 15% 15%,rgba(57,255,136,.13),transparent 30%),
radial-gradient(circle at 85% 70%,rgba(57,255,136,.10),transparent 30%),#020402}
button{font-family:inherit}
.app{width:100%;max-width:620px;min-height:100vh;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px;background:#020402;border-bottom:1px solid var(--border);box-shadow:0 0 25px rgba(57,255,136,.16)}
.topbar h1{font-size:24px;text-shadow:0 0 8px rgba(57,255,136,.8),0 0 22px rgba(57,255,136,.4)}
.topbar p{margin-top:6px;color:var(--green);font-size:14px}
.tg-badge{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--green);background:#030603;border:1px solid var(--green);box-shadow:0 0 12px rgba(57,255,136,.7)}
main{padding:18px}
.balance-card{padding:25px;border-radius:19px;background:linear-gradient(145deg,#07110a,#030704);border:1px solid rgba(57,255,136,.55);box-shadow:0 0 25px rgba(57,255,136,.16),inset 0 0 25px rgba(57,255,136,.04)}
.balance-card span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.balance-card h2{margin-top:8px;font-size:34px;color:var(--green);text-shadow:0 0 9px rgba(57,255,136,.9),0 0 25px rgba(57,255,136,.4)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.quick-grid button{min-height:120px;padding:17px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(145deg,#08100b,#030704);color:#fff;text-align:left;cursor:pointer;transition:.18s;box-shadow:inset 0 0 18px rgba(57,255,136,.02)}
.quick-grid button:hover{transform:translateY(-2px);border-color:var(--green);box-shadow:0 0 15px rgba(57,255,136,.45),0 0 30px rgba(57,255,136,.12)}
.quick-grid button:active{transform:scale(.97)}
.quick-grid b{display:block;margin-top:10px;font-size:16px}
.quick-grid small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.card{margin-top:14px;padding:19px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,#07100a,#030704);box-shadow:0 0 20px rgba(57,255,136,.08)}
.card h3{margin-bottom:14px;text-shadow:0 0 10px rgba(57,255,136,.35)}
.muted{color:var(--muted);font-size:14px;line-height:1.5}
.service{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;margin-top:10px;border:1px solid rgba(57,255,136,.28);border-radius:13px;background:#050b07;color:#fff;text-align:left;cursor:pointer;transition:.18s}
.service:hover{border-color:var(--green);box-shadow:0 0 15px rgba(57,255,136,.35)}
.service b{display:block}.service small{display:block;margin-top:5px;color:var(--muted)}.service strong{color:var(--green);white-space:nowrap;text-shadow:0 0 10px rgba(57,255,136,.65)}
.status{padding:12px;border-radius:12px;background:#061008;border:1px solid rgba(57,255,136,.2);color:var(--muted);font-size:13px}
.error{padding:13px;border-radius:12px;background:rgba(70,0,0,.3);border:1px solid rgba(255,80,80,.4);color:#ff9d9d;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:12px 17px;border-radius:12px;background:#020402;border:1px solid var(--green);color:var(--green);box-shadow:0 0 22px rgba(57,255,136,.5);opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.quick-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div><h1>ZXSMM Panel</h1><p id="welcome">Loading...</p></div>
<div class="tg-badge">TG</div>
</header>
<main>
<section class="balance-card"><span>Available Balance</span><h2 id="balance">₹0.00</h2></section>
<section class="quick-grid">
<button onclick="showServices()">🛒<b>New Order</b><small>Browse services</small></button>
<button onclick="showOrders()">📦<b>My Orders</b><small>Track your orders</small></button>
<button onclick="showAddFunds()">Add Funds</button>
<button onclick="comingSoon('Profile')">👤<b>Profile</b><small>Account settings</small></button>
</section>
<section class="card"><h3>Services</h3><div id="services"><div class="status">Loading services from Supabase...</div></div></section>
</main>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://ckaracfokejzwrwahokr.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_8ODs2YMIXCn3h3YX7VQxmQ_4JrGaLNY";
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const tgUser=tg?.initDataUnsafe?.user;
const $=id=>document.getElementById(id);
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),2200)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v){return "₹"+Number(v||0).toFixed(2)}
$("welcome").textContent=tgUser?`Welcome, ${tgUser.first_name||"User"}`:"Open this app inside Telegram";
async function profile(){
 if(!tgUser)return;
 const {data,error}=await db.from("profiles").select("balance").eq("telegram_id",tgUser.id).maybeSingle();
 if(!error&&data)$("balance").textContent=money(data.balance);
}
async function showServices(){
 $("services").innerHTML='<div class="status">Loading services...</div>';
 const {data,error}=await db.from("services").select("id,name,category,price,description").eq("active",true).order("id");
 if(error){
   console.error("Supabase services error:",error);
   $("services").innerHTML='<div class="error"><b>Services could not be loaded.</b><br>Supabase permissions/table setup needs to be fixed.</div>';
   return;
 }
 if(!data?.length){$("services").innerHTML='<div class="status">No active services found.</div>';return}
 $("services").innerHTML=data.map(s=>`<button class="service" onclick="selectService(${s.id})"><div><b>${esc(s.name)}</b><small>${esc(s.category||"General")}</small></div><strong>${money(s.price)}</strong></button>`).join("");
}
async function selectService(id){
  const {data: service,error}=await db.from("services").select("id,name,category,price").eq("id",id).maybeSingle();
  if(error||!service){toast("Service could not be loaded.");return;}

  $("services").innerHTML=`
    <div class="card">
      <h3>🛒 New Order</h3>
      <div class="status" style="margin-bottom:14px">
        <b>${esc(service.name)}</b><br>
        Price: ${money(service.price)} per 1000
      </div>

      <label style="display:block;margin-bottom:6px">Link</label>
      <input id="orderLink" type="url" placeholder="https://..."
        style="width:100%;padding:14px;border-radius:10px;border:1px solid rgba(57,255,136,.35);background:#030704;color:#fff;outline:none;margin-bottom:14px">

      <label style="display:block;margin-bottom:6px">Quantity</label>
      <input id="orderQuantity" type="number" min="1" placeholder="1000"
        style="width:100%;padding:14px;border-radius:10px;border:1px solid rgba(57,255,136,.35);background:#030704;color:#fff;outline:none;margin-bottom:14px"
        oninput="updateOrderTotal(${Number(service.price)})">

      <div id="orderTotal" class="status" style="margin-bottom:14px">Total: ₹0.00</div>

      <button onclick="placeOrder(${service.id})"
        style="width:100%;padding:15px;border:1px solid #39ff88;border-radius:12px;background:#061008;color:#39ff88;font-weight:bold;cursor:pointer">
        🚀 PLACE ORDER
      </button>

      <button onclick="showServices()"
        style="width:100%;margin-top:10px;padding:12px;border:1px solid rgba(57,255,136,.25);border-radius:12px;background:#030704;color:#fff;cursor:pointer">
        ← Back to Services
      </button>
    </div>`;
}

function updateOrderTotal(pricePer1000){
  const quantity=Number($("orderQuantity")?.value||0);
  $("orderTotal").textContent="Total: "+money((quantity/1000)*pricePer1000);
}

async function placeOrder(serviceId){
  if(!tgUser){toast("Open this app inside Telegram.");return;}

  const link=$("orderLink")?.value.trim();
  const quantity=Number($("orderQuantity")?.value||0);

  if(!link){toast("Enter the link.");return;}
  if(!quantity||quantity<1){toast("Enter a valid quantity.");return;}

  const {data:service,error:serviceError}=await db.from("services")
    .select("id,name,price").eq("id",serviceId).maybeSingle();

  if(serviceError||!service){toast("Service not found.");return;}

  const total=(quantity/1000)*Number(service.price);

  const {data,error}=await db.from("orders").insert([{
    telegram_id:tgUser.id,
    service_id:service.id,
    service_name:service.name,
    link,
    quantity,
    price:total,
    status:"Pending"
  }]).select().single();

  if(error){
    console.error("Create order error:",error);
    $("services").innerHTML=`<div class="error"><b>Order could not be created.</b><br>${esc(error.message)}</div>`;
    return;
  }

  $("services").innerHTML=`
    <div class="card">
      <h3>✅ Order Submitted</h3>
      <div class="status">
        <b>Order #${esc(data.id)}</b><br><br>
        Service: ${esc(service.name)}<br>
        Quantity: ${quantity.toLocaleString()}<br>
        Total: ${money(total)}<br>
        Status: Pending
      </div>
      <button onclick="showOrders()"
        style="width:100%;margin-top:14px;padding:15px;border:1px solid #39ff88;border-radius:12px;background:#061008;color:#39ff88;font-weight:bold;cursor:pointer">
        📦 View My Orders
      </button>
    </div>`;
  toast("Order created!");
}

async function showOrders(){
  $("services").innerHTML='<div class="status">Loading your orders...</div>';
  if(!tgUser){
    $("services").innerHTML='<div class="error"><b>Open this app inside Telegram.</b></div>';
    return;
  }

  const {data,error}=await db.from("orders")
    .select("id,service_name,link,quantity,price,status,created_at")
    .eq("telegram_id",tgUser.id)
    .order("created_at",{ascending:false});

  if(error){
    console.error("Orders error:",error);
    $("services").innerHTML=`<div class="error"><b>Could not load orders.</b><br>${esc(error.message)}</div>`;
    return;
  }

  if(!data?.length){
    $("services").innerHTML='<div class="card"><h3>📦 My Orders</h3><div class="status">No orders yet.</div></div>';
    return;
  }

  $("services").innerHTML='<div class="card"><h3>📦 My Orders</h3>'+
    data.map(o=>`
      <div class="service" style="display:block;cursor:default">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <b>Order #${esc(o.id)}</b>
          <strong>${esc(o.status||"Pending")}</strong>
        </div>
        <small>${esc(o.service_name||"Service")}</small>
        <small>Quantity: ${Number(o.quantity||0).toLocaleString()}</small>
        <small>Price: ${money(o.price)}</small>
        <small style="display:block;margin-top:7px;word-break:break-all">${esc(o.link)}</small>
        <small style="display:block;margin-top:7px">${o.created_at?new Date(o.created_at).toLocaleString():""}</small>
      </div>`).join("")+
  '</div>';
}
function comingSoon(name){toast(name+" will be connected next.")}
 function showAddFunds() {
    $("services").innerHTML = `
        <div class="order-form">

            <h2>Add Funds</h2>

            <p class="muted">
                Add money to your ZXSMM balance.
            </p>

            <label>Enter Amount</label>

            <input
                id="fundAmount"
                type="number"
                min="10"
                step="1"
                placeholder="Enter amount"
            >

            <div class="quick-amounts">
                <button onclick="setFundAmount(100)">₹100</button>
                <button onclick="setFundAmount(250)">₹250</button>
                <button onclick="setFundAmount(500)">₹500</button>
                <button onclick="setFundAmount(1000)">₹1000</button>
            </div>

            <button class="place-order-btn" onclick="startPayment()">
                CONTINUE TO PAYMENT
            </button>

            <button class="back-btn" onclick="showServices()">
                ← Back
            </button>

        </div>
    `;
}

function setFundAmount(amount) {
    const input = $("fundAmount");
    if (input) {
        input.value = amount;
    }
}

function startPayment() {
    const amount = Number($("fundAmount")?.value || 0);

    if (amount < 10) {
        toast("Minimum amount is ₹10");
        return;
    }

    toast("Payment gateway will be connected next.");
}
profile();
showServices();
</script>
</body>
</html>
