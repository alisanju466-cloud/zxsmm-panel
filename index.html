<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020402">
<title>ZXSMM Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020402;--card:#07100a;--green:#39ff88;--muted:#8fa596;--border:rgba(57,255,136,.35)}
html,body{min-height:100%;background:#020402}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:
radial-gradient(circle at 15% 15%,rgba(57,255,136,.13),transparent 30%),
radial-gradient(circle at 85% 70%,rgba(57,255,136,.10),transparent 30%),#020402}
button{font-family:inherit}
.app{width:100%;max-width:620px;min-height:100vh;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px;background:#020402;border-bottom:1px solid var(--border);box-shadow:0 0 25px rgba(57,255,136,.16)}
.topbar h1{font-size:24px;text-shadow:0 0 8px rgba(57,255,136,.8),0 0 22px rgba(57,255,136,.4)}
.topbar p{margin-top:6px;color:var(--green);font-size:14px}
.tg-badge{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--green);background:#030603;border:1px solid var(--green);box-shadow:0 0 12px rgba(57,255,136,.7)}
main{padding:18px}
.balance-card{padding:25px;border-radius:19px;background:linear-gradient(145deg,#07110a,#030704);border:1px solid rgba(57,255,136,.55);box-shadow:0 0 25px rgba(57,255,136,.16),inset 0 0 25px rgba(57,255,136,.04)}
.balance-card span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.balance-card h2{margin-top:8px;font-size:34px;color:var(--green);text-shadow:0 0 9px rgba(57,255,136,.9),0 0 25px rgba(57,255,136,.4)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.quick-grid button{min-height:120px;padding:17px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(145deg,#08100b,#030704);color:#fff;text-align:left;cursor:pointer;transition:.18s;box-shadow:inset 0 0 18px rgba(57,255,136,.02)}
.quick-grid button:hover{transform:translateY(-2px);border-color:var(--green);box-shadow:0 0 15px rgba(57,255,136,.45),0 0 30px rgba(57,255,136,.12)}
.quick-grid button:active{transform:scale(.97)}
.quick-grid b{display:block;margin-top:10px;font-size:16px}
.quick-grid small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.card{margin-top:14px;padding:19px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,#07100a,#030704);box-shadow:0 0 20px rgba(57,255,136,.08)}
.card h3{margin-bottom:14px;text-shadow:0 0 10px rgba(57,255,136,.35)}
.muted{color:var(--muted);font-size:14px;line-height:1.5}
.service{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;margin-top:10px;border:1px solid rgba(57,255,136,.28);border-radius:13px;background:#050b07;color:#fff;text-align:left;cursor:pointer;transition:.18s}
.service:hover{border-color:var(--green);box-shadow:0 0 15px rgba(57,255,136,.35)}
.service b{display:block}.service small{display:block;margin-top:5px;color:var(--muted)}.service strong{color:var(--green);white-space:nowrap;text-shadow:0 0 10px rgba(57,255,136,.65)}
.status{padding:12px;border-radius:12px;background:#061008;border:1px solid rgba(57,255,136,.2);color:var(--muted);font-size:13px}
.error{padding:13px;border-radius:12px;background:rgba(70,0,0,.3);border:1px solid rgba(255,80,80,.4);color:#ff9d9d;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:12px 17px;border-radius:12px;background:#020402;border:1px solid var(--green);color:var(--green);box-shadow:0 0 22px rgba(57,255,136,.5);opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.quick-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div><h1>ZXSMM Panel</h1><p id="welcome">Loading...</p></div>
<div class="tg-badge">TG</div>
</header>
<main>
<section class="balance-card"><span>Available Balance</span><h2 id="balance">₹0.00</h2></section>
<section class="quick-grid">
<button onclick="showServices()">🛒<b>New Order</b><small>Browse services</small></button>
<button onclick="comingSoon('My Orders')">📦<b>My Orders</b><small>Track your orders</small></button>
<button onclick="comingSoon('Add Funds')">💰<b>Add Funds</b><small>Top up balance</small></button>
<button onclick="comingSoon('Profile')">👤<b>Profile</b><small>Account settings</small></button>
</section>
<section class="card"><h3>Services</h3><div id="services"><div class="status">Loading services from Supabase...</div></div></section>
</main>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://ckaracfokejzwrwahokr.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_8ODs2YMIXCn3h3YX7VQxmQ_4JrGaLNY";
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const tgUser=tg?.initDataUnsafe?.user;
const $=id=>document.getElementById(id);
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),2200)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v){return "₹"+Number(v||0).toFixed(2)}
$("welcome").textContent=tgUser?`Welcome, ${tgUser.first_name||"User"}`:"Open this app inside Telegram";
async function profile(){
 if(!tgUser)return;
 const {data,error}=await db.from("profiles").select("balance").eq("telegram_id",tgUser.id).maybeSingle();
 if(!error&&data)$("balance").textContent=money(data.balance);
}
async function showServices(){
 $("services").innerHTML='<div class="status">Loading services...</div>';
 const {data,error}=await db.from("services").select("id,name,category,price,description").eq("active",true).order("id");
 if(error){
   console.error("Supabase services error:",error);
   $("services").innerHTML='<div class="error"><b>Services could not be loaded.</b><br>Supabase permissions/table setup needs to be fixed.</div>';
   return;
 }
 if(!data?.length){$("services").innerHTML='<div class="status">No active services found.</div>';return}
 $("services").innerHTML=data.map(s=>`<button class="service" onclick="selectService(${s.id})"><div><b>${esc(s.name)}</b><small>${esc(s.category||"General")}</small></div><strong>${money(s.price)}</strong></button>`).join("");
}
function selectService(id){toast("Service "+id+" selected — order form next.")}
function comingSoon(name){toast(name+" will be connected next.")}
profile();
showServices();
</script>
</body>
</html>
